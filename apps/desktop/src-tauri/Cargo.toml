[package]
name = "gtm-factory-desktop"
version = "0.1.0"
description = "GTM Factory for Mac: the hosted dashboard, plus your own Claude subscription through the claude CLI."
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "gtm_factory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt-multi-thread"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
